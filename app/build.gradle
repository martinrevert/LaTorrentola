def getGitVersionCount(providers) {
    def gitPath = null
    
    // 1. Try 'where' command on Windows to find absolute path
    try {
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            def where = providers.exec {
                commandLine 'cmd', '/c', 'where git'
                ignoreExitValue = true
            }.standardOutput.asText.getOrNull()?.trim()
            if (where) {
                gitPath = where.split("[\r\n]+")[0].trim()
            }
        }
    } catch (Exception e) {}
    
    // 2. Fallback to manual PATH search
    if (!gitPath) {
        try {
            def searchDirs = []
            def path = System.getenv("PATH")
            if (path != null) {
                def sep = System.getProperty("path.separator") ?: ";"
                searchDirs.addAll(path.split(sep))
            }
            
            // Common Git paths on Windows
            if (System.getProperty("os.name").toLowerCase().contains("windows")) {
                searchDirs.add("C:\\Program Files\\Git\\bin")
                searchDirs.add("C:\\Program Files (x86)\\Git\\bin")
            }

            for (def dir : searchDirs) {
                if (!dir) continue
                def d = new File(dir.trim())
                if (d.isDirectory()) {
                    def ge = new File(d, "git.exe")
                    def gc = new File(d, "git.cmd")
                    def g = new File(d, "git")
                    if (ge.isFile()) { gitPath = ge.absolutePath; break }
                    if (gc.isFile()) { gitPath = gc.absolutePath; break }
                    if (g.isFile()) { gitPath = g.absolutePath; break }
                }
            }
        } catch (Exception e) {}
    }
    
    // 3. Final Check & Execution
    if (!gitPath) {
        throw new GradleException("CRITICAL: 'git' executable not found in PATH or common locations. " +
            "Please ensure Git is installed and added to your system PATH. " +
            "The project requires Git to calculate the version code (last successful was 20159+).")
    }

    try {
        def output = providers.exec {
            commandLine gitPath, 'rev-list', '--count', 'HEAD'
            ignoreExitValue = false // Fail if the command itself fails
        }.standardOutput.asText.get().trim()
        
        if (output.isInteger()) return output.toInteger()
    } catch (Exception e) {
        throw new GradleException("CRITICAL: Failed to execute git at '$gitPath'. " +
            "Error: ${e.message}. Ensure the current directory is a valid git repository.")
    }
    
    return 0
}

def gitVersionCount = getGitVersionCount(providers)

android {
    namespace = 'com.martinrevert.latorrentola'
    compileSdk = 37

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    def gitVersionCode = gitVersionCount

    defaultConfig {
        applicationId = "com.martinrevert.latorrentola"
        versionCode = 20000 + gitVersionCode
        versionName = "2.0.$gitVersionCode"
        minSdk = 24
        targetSdk = 37
        testInstrumentationRunner = "com.martinrevert.latorrentola.HiltTestRunner"

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        buildConfigField "String", "WEB_CLIENT_ID", "\"${localProperties.getProperty('FIREBASE_WEB_CLIENT_ID', '')}\""
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols.add('**/libandroidx.graphics.path.so')
            keepDebugSymbols.add('**/libtranslate_jni.so')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile = file("keys/release.keystore")
            storePassword = keystoreProperties['RELEASE_STORE_PASSWORD'] ?: project.findProperty("RELEASE_STORE_PASSWORD") ?: ""
            keyAlias = keystoreProperties['RELEASE_KEY_ALIAS'] ?: project.findProperty("RELEASE_KEY_ALIAS") ?: ""
            keyPassword = keystoreProperties['RELEASE_KEY_PASSWORD'] ?: project.findProperty("RELEASE_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage = true
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.all {
            jvmArgs(
                "-XX:+EnableDynamicAgentLoading",
                "--add-opens=java.base/java.lang=ALL-UNNAMED",
                "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
                "--add-opens=java.base/java.util=ALL-UNNAMED",
                "--add-opens=jdk.unsupported/sun.misc=ALL-UNNAMED",
                "--add-opens=java.base/java.security=ALL-UNNAMED",
                "--add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED",
                "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
                "-XX:+IgnoreUnrecognizedVMOptions"
            )
            systemProperty "net.bytebuddy.experimental", "true"
            systemProperty "jdk.attach.allowAttachSelf", "true"
        }
    }
}

