def getGitVersionCount(providers) {
    return providers.exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
        ignoreExitValue = true
    }.standardOutput.asText.map { it.trim() }.map { it.isInteger() ? it.toInteger() : 0 }.getOrElse(0)
}

android {
    namespace = 'com.martinrevert.latorrentola'
    compileSdk = 37

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    def gitVersionCode = getGitVersionCount(providers)

    defaultConfig {
        applicationId "com.martinrevert.latorrentola"
        versionCode 20000 + gitVersionCode
        versionName "2.0.$gitVersionCode"
        minSdkVersion 24
        targetSdkVersion 37
        testInstrumentationRunner "com.martinrevert.latorrentola.HiltTestRunner"

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        buildConfigField "String", "WEB_CLIENT_ID", "\"${localProperties.getProperty('FIREBASE_WEB_CLIENT_ID', '')}\""
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file("keys/release.keystore")
            storePassword keystoreProperties['RELEASE_STORE_PASSWORD'] ?: project.findProperty("RELEASE_STORE_PASSWORD") ?: ""
            keyAlias keystoreProperties['RELEASE_KEY_ALIAS'] ?: project.findProperty("RELEASE_KEY_ALIAS") ?: ""
            keyPassword keystoreProperties['RELEASE_KEY_PASSWORD'] ?: project.findProperty("RELEASE_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.all {
            jvmArgs(
                "-XX:+EnableDynamicAgentLoading",
                "--add-opens=java.base/java.lang=ALL-UNNAMED",
                "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
                "--add-opens=java.base/java.util=ALL-UNNAMED",
                "--add-opens=jdk.unsupported/sun.misc=ALL-UNNAMED",
                "--add-opens=java.base/java.security=ALL-UNNAMED",
                "--add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED",
                "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
                "-XX:+IgnoreUnrecognizedVMOptions"
            )
            systemProperty "net.bytebuddy.experimental", "true"
            systemProperty "jdk.attach.allowAttachSelf", "true"
        }
    }
}

